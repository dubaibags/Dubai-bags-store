<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dubai Bags</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="script.js" defer></script>
</head>

<body>

<header class="header">

    <div class="logo">
        <h1>Dubai Bags</h1>
        <p>Luxury Bags • Watches • Slippers • Clothes</p>
    </div>

    <nav>
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Categories</a>
        <a href="#">Contact</a>
    </nav>

</header>

<section class="hero">

    <h2>Luxury Collection</h2>

    <p>Discover Premium Bags, Watches, Slippers & Clothes</p>

    <button>Shop Now</button>

</section>

<section class="categories">

    <div class="card">👜<br>Bags</div>

    <div class="card">⌚<br>Watches</div>

    <div class="card">👡<br>Slippers</div>

    <div class="card">👕<br>Clothes</div>

</section>

<section class="products">

<h2>Products</h2>

<div id="product-list">

</div>

</section>

<section class="cart">

<h2>Shopping Cart</h2>

<div id="cart-items"></div>

<h3 id="total">AED 0</h3>

<button id="checkout">
Checkout via WhatsApp
</button>

</section>

<footer>

<p>© 2026 Dubai Bags</p>

</footer>

</body>

</html>
